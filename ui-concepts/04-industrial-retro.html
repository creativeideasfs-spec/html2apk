<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML2APK · 工业复古</title>
<style>
  :root {
    --paper: #f0ede4;
    --paper-2: #e6e2d6;
    --ink: #15150f;
    --ink-2: #4d4a3e;
    --ink-3: #8a8677;
    --line: #15150f;
    --accent: #e4572e;
    --accent-2: #d9a404;
    --ok: #1a7a3c;
    --err: #c81e1e;
    --mono: "Courier New", Courier, ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(21,21,15,0.05) 27px 28px),
      var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 480px; padding: 0 0 calc(120px + env(safe-area-inset-bottom)); }

  /* 顶部品牌条 */
  .brandbar {
    display: flex; align-items: stretch; justify-content: space-between;
    border-bottom: 3px solid var(--ink);
    background: var(--paper);
    padding: 12px 14px;
    position: sticky; top: 0; z-index: 20;
  }
  .brandbar .name { font-size: 20px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2; }
  .brandbar .name small { display: block; font-size: 9px; letter-spacing: 0.28em; color: var(--ink-2); font-weight: 400; }
  .brandbar .mach {
    border: 2px solid var(--ink); padding: 4px 10px;
    font-size: 11px; letter-spacing: 0.14em; align-self: center;
    background: var(--accent-2);
    transform: rotate(-1.5deg);
  }

  /* 警示条 */
  .warn-strip {
    border-bottom: 2px solid var(--ink);
    background: var(--accent);
    color: #fff;
    padding: 5px 14px;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    display: flex; justify-content: space-between;
  }

  /* 面板 */
  .panel { border-bottom: 3px solid var(--ink); background: var(--paper); }
  .panel-tag {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding: 7px 14px;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    background: var(--paper-2);
  }
  .panel-tag .code { color: var(--accent); font-weight: 700; }
  .panel-body { padding: 14px; }

  /* 按钮 */
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    appearance: none; cursor: pointer;
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 13px 10px;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.12s ease;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:disabled { background: var(--ink-3); color: rgba(255,255,255,.6); box-shadow: 4px 4px 0 var(--ink); cursor: not-allowed; }
  .btn.full { width: 100%; }
  .btn .sub { display: block; font-size: 9px; letter-spacing: 0.2em; font-weight: 400; opacity: 0.75; }

  /* 已选路径 */
  .path {
    margin-top: 14px; padding: 9px 11px;
    border: 2px dashed var(--ink-2);
    font-size: 12px; color: var(--ink-2);
    display: flex; align-items: center; gap: 8px; word-break: break-all;
  }
  .path .x { margin-left: auto; color: var(--err); cursor: pointer; flex-shrink: 0; font-weight: 700; padding: 0 4px; }

  /* 表单 */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: flex; justify-content: space-between;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-2); margin-bottom: 5px;
  }
  .field label i { font-style: normal; color: var(--accent); }
  .field input {
    width: 100%; padding: 10px 12px;
    background: #fff;
    border: 2px solid var(--ink);
    font-family: var(--mono); font-size: 13px; color: var(--ink);
    outline: none; border-radius: 0;
  }
  .field input:focus { background: #fffbe8; }
  .field input::placeholder { color: var(--ink-3); }
  .field .hint { font-size: 11px; color: var(--ink-3); margin-top: 4px; letter-spacing: 0.02em; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* 日志（打印纸） */
  .log-wrap { background: #fbfaf5; border: 2px solid var(--ink); padding: 10px; }
  .log {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.75;
    color: var(--ink); min-height: 120px; max-height: 260px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  .log .t { color: var(--ink-3); }
  .log .step { color: var(--accent); font-weight: 700; }
  .log .ok { color: var(--ok); font-weight: 700; }
  .log .err { color: var(--err); font-weight: 700; }

  /* 结果（盖章） */
  .result-stamp {
    display: flex; align-items: center; gap: 14px;
    border: 3px double var(--ok); padding: 14px;
    background: rgba(26,122,60,0.07);
    margin-bottom: 14px;
  }
  .result-stamp .seal {
    width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0;
    border: 3px solid var(--ok); color: var(--ok);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    transform: rotate(-8deg);
    line-height: 1.25;
  }
  .result-stamp .seal b { font-size: 15px; }
  .result-stamp h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; }
  .result-stamp p { font-size: 12px; color: var(--ink-2); }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 6px 0; border-bottom: 1px dashed var(--ink-3); }
  .kv:last-of-type { border-bottom: none; }
  .kv .k { color: var(--ink-2); flex-shrink: 0; }
  .kv .v { word-break: break-all; text-align: right; }

  /* 底部执行栏 */
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 100%; max-width: 480px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--paper);
    border-top: 3px solid var(--ink);
    z-index: 20;
  }
  .dock .btn { font-size: 15px; padding: 15px 10px; }
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: var(--ink); color: var(--paper);
    font-size: 12px; padding: 9px 16px; letter-spacing: 0.04em;
    opacity: 0; transition: all 0.2s ease; z-index: 99; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="brandbar">
    <div class="name">HTML2APK<small>LOCAL APK FABRICATOR</small></div>
    <div class="mach">MACHINE&nbsp;01</div>
  </div>
  <div class="warn-strip"><span>⚠ 离线构建 · 数据不出设备</span><span>REV 1.0.1</span></div>

  <div class="panel">
    <div class="panel-tag"><span class="code">[01]</span> INPUT FEED <span>选择输入</span></div>
    <div class="panel-body">
      <div class="btn-row">
        <button class="btn" id="pickFile">选择 HTML 文件<span class="sub">SINGLE FILE</span></button>
        <button class="btn" id="pickDir">选择文件夹<span class="sub">DIRECTORY</span></button>
      </div>
      <div class="path" id="pathBox" hidden><span id="pathText"></span><span class="x" id="clearPath">✕ 清除</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-tag"><span class="code">[02]</span> CONFIG DIALS <span>应用配置</span></div>
    <div class="panel-body">
      <div class="field">
        <label for="appName">应用名称 <i>REQUIRED</i></label>
        <input id="appName" placeholder="例如：我的网页工具" autocomplete="off">
      </div>
      <div class="field">
        <label for="pkg">包名 <i>OPTIONAL</i></label>
        <input id="pkg" placeholder="留空自动生成" autocomplete="off">
        <div class="hint">格式 com.example.app</div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="verName">版本号</label>
          <input id="verName" value="1.0" autocomplete="off">
        </div>
        <div class="field">
          <label for="verCode">版本代码</label>
          <input id="verCode" value="1" inputmode="numeric" autocomplete="off">
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-tag"><span class="code">[03]</span> OUTPUT LOG <span>构建输出</span></div>
    <div class="panel-body">
      <div class="log-wrap">
        <div class="log" id="log"><span class="t">-- waiting for build --</span></div>
      </div>
    </div>
  </div>

  <div class="panel" id="resultPanel" hidden>
    <div class="panel-tag"><span class="code">[04]</span> FINAL OUTPUT <span>结果</span></div>
    <div class="panel-body">
      <div class="result-stamp">
        <div class="seal"><b>OK</b>BUILD</div>
        <div>
          <h3>构建成功</h3>
          <p>APK 已生成，可立即安装</p>
        </div>
      </div>
      <div class="kv"><span class="k">OUTPUT</span><span class="v" id="rPath">-</span></div>
      <div class="kv"><span class="k">SIZE</span><span class="v" id="rSize">-</span></div>
      <div class="kv"><span class="k">PKG</span><span class="v" id="rPkg">-</span></div>
      <div style="height:12px"></div>
      <div class="btn-row">
        <button class="btn primary" id="installBtn">安装 APK</button>
        <button class="btn" id="openDirBtn">打开目录</button>
      </div>
    </div>
  </div>
</div>

<div class="dock">
  <button class="btn primary full" id="buildBtn" disabled>EXECUTE BUILD</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { input: null, building: false };
  var steps = [
    ['init', '初始化构建引擎…'],
    ['input', '拷贝 HTML 资源…'],
    ['config', '生成配置与资源…'],
    ['compile', '编译资源…'],
    ['link', '链接 APK…'],
    ['dex', '合并壳代码…'],
    ['align', '对齐优化…'],
    ['sign', '签名…'],
    ['output', '输出 APK…']
  ];

  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function(){t.classList.remove('show');}, 1800); }
  function refresh() {
    $('buildBtn').disabled = !(state.input && $('appName').value.trim() && !state.building);
  }
  ['appName','pkg','verName','verCode'].forEach(function(id){ $(id).addEventListener('input', refresh); });

  $('pickFile').addEventListener('click', function () {
    var f = document.createElement('input'); f.type='file'; f.accept='.html,.htm';
    f.onchange = function(){ if(f.files[0]) setInput(f.files[0].name); };
    f.click();
  });
  $('pickDir').addEventListener('click', function () {
    var f = document.createElement('input'); f.type='file'; f.webkitdirectory = true;
    f.onchange = function(){ if(f.files.length) setInput('…/' + f.files[0].webkitRelativePath.split('/')[0] + '/'); };
    f.click();
  });
  function setInput(p){ state.input = p; $('pathText').textContent = p; $('pathBox').hidden = false; refresh(); }
  $('clearPath').addEventListener('click', function(){ state.input=null; $('pathBox').hidden=true; refresh(); });

  $('buildBtn').addEventListener('click', function () {
    if (state.building) return;
    var appName = $('appName').value.trim();
    if (!appName) { toast('请填写应用名称'); return; }
    var pkg = $('pkg').value.trim();
    var re = /^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/;
    if (pkg && !re.test(pkg)) { toast('包名格式不正确'); return; }
    if (!pkg) pkg = 'com.html2apk.app' + Math.floor(Math.random()*99999);

    state.building = true;
    $('resultPanel').hidden = true;
    var log = $('log'); log.textContent = '';
    $('buildBtn').disabled = true; $('buildBtn').textContent = 'BUILDING…';
    var t0 = new Date();

    var i = 0;
    (function tick(){
      if (i < steps.length) {
        var s = steps[i];
        var ts = new Date(t0.getTime() + i*300);
        var hh = ('0'+ts.getHours()).slice(-2), mm = ('0'+ts.getMinutes()).slice(-2), ss = ('0'+ts.getSeconds()).slice(-2);
        log.innerHTML += '<span class="t">[' + hh + ':' + mm + ':' + ss + ']</span> <span class="step">' + s[0] + '</span> ' + s[1] + '\n';
        log.scrollTop = log.scrollHeight;
        i++; setTimeout(tick, 200 + Math.random()*200);
      } else {
        log.innerHTML += '<span class="t">[done]</span> <span class="ok">BUILD COMPLETE - 12.7 KB</span>\n';
        log.scrollTop = log.scrollHeight;
        state.building = false;
        $('rPath').textContent = '/Download/HTML2APK/' + appName + '-v' + ($('verName').value||'1.0') + '.apk';
        $('rSize').textContent = '12.7 KB';
        $('rPkg').textContent = pkg;
        $('resultPanel').hidden = false;
        $('buildBtn').textContent = 'EXECUTE BUILD'; $('buildBtn').disabled = false;
        toast('构建完成');
      }
    })();
  });
  $('installBtn').addEventListener('click', function(){ toast('已拉起系统安装器'); });
  $('openDirBtn').addEventListener('click', function(){ toast('已打开 Download/HTML2APK/'); });
  refresh();
})();
</script>
</body>
</html>
