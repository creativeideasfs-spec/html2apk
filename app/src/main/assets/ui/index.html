<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0ede4">
<title>HTML2APK · 工业控制台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div class="brandbar">
    <div class="name">HTML2APK<small>LOCAL APK FABRICATOR</small></div>
    <div class="mach">MACHINE&nbsp;01</div>
  </div>
  <div class="warn-strip">
    <span>⚠ 离线构建 · 数据不出设备</span>
    <span class="eng"><i id="engLed" class="led off"></i><span id="engText">ENGINE CHECK</span></span>
  </div>

  <div class="panel">
    <div class="panel-tag"><span class="code">[01]</span> INPUT FEED <span>选择输入</span></div>
    <div class="panel-body">
      <div class="btn-row">
        <button class="btn" id="pickFile">选择 HTML 文件<span class="sub">SINGLE FILE</span></button>
        <button class="btn" id="pickDir">选择文件夹<span class="sub">DIRECTORY</span></button>
      </div>
      <div class="path" id="pathBox" hidden><span id="pathText"></span><span class="x" id="clearPath">✕ 清除</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-tag"><span class="code">[02]</span> CONFIG DIALS <span>应用配置</span></div>
    <div class="panel-body">
      <div class="field">
        <label for="appName">应用名称 <i>REQUIRED</i></label>
        <input id="appName" placeholder="例如：我的网页工具" autocomplete="off">
      </div>
      <div class="field">
        <label for="pkg">包名 <i>OPTIONAL</i></label>
        <input id="pkg" placeholder="留空自动生成" autocomplete="off">
        <div class="hint">格式 com.example.app</div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="verName">版本号</label>
          <input id="verName" value="1.0" autocomplete="off">
        </div>
        <div class="field">
          <label for="verCode">版本代码</label>
          <input id="verCode" value="1" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label for="iconBtn">封面图标 <i>OPTIONAL</i></label>
        <div class="icon-row">
          <img id="iconPreview" class="icon-preview" alt="icon" hidden>
          <button class="btn small" id="iconBtn">选择图片<span class="sub">COVER IMAGE</span></button>
          <button class="btn small ghost" id="iconClear" hidden>恢复默认<span class="sub">RESET</span></button>
        </div>
        <div class="hint">上传一张图片作为 APK 桌面图标，建议正方形；不选则使用默认图标</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-tag"><span class="code">[03]</span> OUTPUT LOG <span>构建输出</span></div>
    <div class="panel-body">
      <div class="log-wrap">
        <div class="log" id="log"><span class="t">-- waiting for build --</span></div>
      </div>
    </div>
  </div>

  <div class="panel" id="resultPanel" hidden>
    <div class="panel-tag"><span class="code">[04]</span> FINAL OUTPUT <span>结果</span></div>
    <div class="panel-body">
      <div class="result-stamp">
        <div class="seal"><b>OK</b>BUILD</div>
        <div>
          <h3>构建成功</h3>
          <p>APK 已生成，可立即安装</p>
        </div>
      </div>
      <div class="kv"><span class="k">OUTPUT</span><span class="v" id="rPath">-</span></div>
      <div class="kv"><span class="k">SIZE</span><span class="v" id="rSize">-</span></div>
      <div class="kv"><span class="k">PKG</span><span class="v" id="rPkg">-</span></div>
      <div style="height:12px"></div>
      <button class="btn primary full" id="installBtn">安装 APK<span class="sub">INSTALL NOW</span></button>
    </div>
  </div>
</div>

<div class="dock">
  <button class="btn primary full" id="buildBtn" disabled>EXECUTE BUILD</button>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
